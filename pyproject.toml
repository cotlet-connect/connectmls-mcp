[project]
name = "connectmls-mcp"
version = "1.1.0"
description = "Connect connectMLS to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No connectMLS API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["connectmls", "connectmls api", "connectmls mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/mcp/connectmls?utm_source=pypi&utm_medium=package&utm_campaign=connectmls"
Source = "https://github.com/cotlet-connect/connectmls-mcp"

[project.scripts]
connectmls-mcp = "connectmls_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"connectmls_agent.py" = "connectmls_agent.py"

[tool.hatch.build.targets.sdist]
include = ["connectmls_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
